services:
  vectorai:
    image: actian/vectorai:latest   # pin to a specific tag before publishing
    platform: linux/amd64
    container_name: vectorai
    ports:
      - "6573:6573"   # REST
      - "6574:6574"   # gRPC (used by the harness)
    volumes:
      - ./local_data:/var/lib/actian-vectorai
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
    restart: unless-stopped

