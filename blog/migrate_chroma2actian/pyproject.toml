[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma2actian"
version = "1.0.0"
description = "Production-grade migration of Chroma (local, self-hosted, Chroma Cloud) collections to Actian VectorAI DB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "actian-vectorai-client>=1.0.3,<2",
    "chromadb>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chroma2actian = "chroma2actian.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs a running Actian VectorAI DB (set ACTIAN_LIVE=1)"]
