services:
  vectorai:
    image: actian/vectorai:latest
    ports:
      - "6583:6573"   # REST API
      - "6584:6574"   # gRPC API, used by the Python SDK
      - "6585:6575"   # local web UI
    volumes:
      - ./vectorai_data:/var/lib/actian-vectorai
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
    restart: unless-stopped