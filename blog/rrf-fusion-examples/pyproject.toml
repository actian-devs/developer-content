[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actian-rrf-fusion-examples"
version = "0.1.0"
description = "Reproducible examples for Reciprocal Rank Fusion and Actian VectorAI DB fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "actian-vectorai-client==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rrf_examples"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

