# Offline configuration for the hardened audit.
# VectorAI DB's nonessential usage notification remains blocked
# by the network policy.
#
# Use with docker-compose.yml and docker-compose.audit.yml.

services:
  ollama:
    environment:
      - OLLAMA_NO_CLOUD=1

  phoenix:
    environment:
      - PHOENIX_ALLOW_EXTERNAL_RESOURCES=false
      - PHOENIX_TELEMETRY_ENABLED=false

  app:
    environment:
      - HF_HUB_OFFLINE=1
